services:
  backend:
    build:
      context: ..
      dockerfile: docker/image-backend/Dockerfile
    container_name: taskflow-backend
    working_dir: /var/www/html
    volumes:
      - ../app/backend:/var/www/html
      - ../.env:/var/www/html/.env
    ports:
      - 9000
    env_file:
      - ../.env

  nginx:
    image: nginx:alpine
    container_name: taskflow-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ../app/backend:/var/www/html:ro
      - ./configs/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ..
      dockerfile: docker/image-frontend/Dockerfile
    container_name: taskflow-frontend
    working_dir: /app
    volumes:
      - ../app/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000

volumes:
  frontend_node_modules:
