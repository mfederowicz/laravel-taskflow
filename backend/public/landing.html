<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TaskFlow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  main { max-width: 480px; padding: 2rem; text-align: center; }
  h1 { margin-bottom: 0.5rem; }
  p { color: #94a3b8; margin-bottom: 2rem; }
  .links { display: flex; flex-direction: column; gap: 1rem; }
  a { display: block; padding: 1rem; border-radius: 0.5rem; text-decoration: none; font-weight: 600; }
  .nuxt { background: #10b981; color: #052e1c; }
  .filament { background: #f59e0b; color: #451a03; }
  small { display: block; margin-top: 0.5rem; font-weight: 400; opacity: 0.8; }
</style>
</head>
<body>
<main>
  <h1>TaskFlow</h1>
  <p>Choose which client to use.</p>
  <div class="links">
    <a class="nuxt" href="/nuxt/">Nuxt app<small>Full task management UI</small></a>
    <a class="filament" href="/filament">Filament app<small>Task CRUD demo built with Filament/Livewire</small></a>
  </div>
</main>
</body>
</html>
